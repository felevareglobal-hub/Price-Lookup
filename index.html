<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Lookup</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7280;--line:#e3e6ec;--pur:#475569;--sal:#0b6b3a;--acc:#2457d6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#e8ebf1;--mut:#939bab;--line:#2a303c;--pur:#aab4c5;--sal:#4ade80;--acc:#7aa2ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 12px}
input[type=search],input[type=email],input[type=password]{width:100%;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);outline:none;margin-bottom:10px}
#q{font-size:22px;padding:14px 16px;margin:0}
input:focus{border-color:var(--acc)}
button.primary{width:100%;font-size:17px;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;cursor:pointer}
.login{max-width:360px;margin:12vh auto 0}
.err{color:#d33;font-size:14px;min-height:20px;margin-top:8px}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:10px 2px 14px;font-size:13px;color:var(--mut)}
.bar button,.bar label.btn{font:inherit;color:var(--acc);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.bar input[type=file]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.part{font-size:20px;font-weight:700;margin-bottom:10px}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:8px 0 6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:62px}
.c .l{font-size:11px;color:var(--mut);display:block}
.c b{font-size:20px;display:block}
.c small{font-size:12px;color:var(--mut)}
.pur b{color:var(--pur)} .sal b{color:var(--sal)}
.na{color:var(--mut)}
.extra{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:14px}
.extra span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.extra em{font-style:normal;color:var(--mut);font-size:12px;margin-right:4px}
.msg{text-align:center;color:var(--mut);padding:36px 0}
body.nopur .purwrap{display:none}
@media (max-width:420px){.c b{font-size:17px}}
</style>
</head>
<body>

<div class="wrap" id="loginView" hidden>
  <form id="loginForm" class="card login">
    <h1>Price Lookup &ndash; Sign in</h1>
    <input id="email" type="email" placeholder="Email" required autocomplete="username">
    <input id="pw" type="password" placeholder="Password" required autocomplete="current-password">
    <button class="primary" type="submit">Sign in</button>
    <div id="err" class="err"></div>
  </form>
</div>

<div class="wrap" id="appView" hidden>
  <h1>Price Lookup</h1>
  <input id="q" type="search" placeholder="Type Part No. e.g. CA-U2E" autocomplete="off" autocapitalize="characters">
  <div class="bar">
    <span id="src"></span>
    <button id="refresh" type="button">Refresh</button>
    <label class="btn" id="upl" hidden>Upload price list<input id="file" type="file" accept=".xlsx,.xls"></label>
    <label id="purOpt"><input id="showpur" type="checkbox" checked> Show purchase prices</label>
    <span id="who"></span>
    <button id="logout" type="button">Sign out</button>
  </div>
  <div id="out"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SUPABASE_URL = 'PASTE-YOUR-PROJECT-URL';
const SUPABASE_KEY = 'PASTE-YOUR-ANON-PUBLIC-KEY';

const $ = id => document.getElementById(id);
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb = null, rows = [], role = null, uid = null;

function cell(v){
  if (v == null || String(v).trim() === '') return null;
  if (typeof v === 'number') return {p: v, q: ''};
  const m = String(v).match(/^\s*([\d,]+(?:\.\d+)?)\s*(?:\(\s*([^)]*?)\s*\)?)?\s*$/);
  if (!m) return {p: null, q: String(v)};
  let q = m[2] || '';
  if (/^\d+$/.test(q)) q = String(+q);
  return {p: parseFloat(m[1].replace(/,/g, '')), q};
}
function money(c){
  if (!c) return '<span class="na">&mdash;</span>';
  if (c.p == null) return esc(c.q);
  return '&#8377;' + c.p.toLocaleString('en-IN', {maximumFractionDigits: 2});
}
const box = (c, i) => `<div class="c"><span class="l">${i}</span><b>${money(c)}</b>${c && c.p != null && c.q ? `<small>Qty ${esc(c.q)}</small>` : ''}</div>`;
const chip = (name, c, cls) => c ? `<span class="${cls || ''}"><em>${name}</em>${money(c)}${c.p != null && c.q ? ` <small>(${esc(c.q)})</small>` : ''}</span>` : '';

// find columns by heading, so deleting or moving columns in Excel does not break the app
function layout(raw){
  const L = {part: 0, old: 1, pur: 2, sal: 7, mrp: 10, start: 2};
  let hr = -1;
  for (let i = 0; i < Math.min(raw.length, 10); i++)
    if ((raw[i] || []).some(v => /part/i.test(String(v == null ? '' : v)))) { hr = i; break; }
  if (hr < 0) return L;
  const find = re => {
    for (let i = 0; i <= hr; i++){
      const j = (raw[i] || []).findIndex(v => v != null && re.test(String(v)));
      if (j >= 0) return j;
    }
    return -1;
  };
  L.start = hr + 1;
  L.part = Math.max(0, (raw[hr] || []).findIndex(v => /part/i.test(String(v == null ? '' : v))));
  const p = find(/purchase/i), s = find(/^\s*sales?\s*$/i);
  if (p >= 0) L.pur = p;
  if (s >= 0) L.sal = s;
  L.mrp = find(/mrp/i);
  L.old = find(/old|current/i);
  return L;
}

function build(sales, purchase){
  const pm = new Map((purchase || []).map(r => [norm(r[0]), r]));
  rows = sales.map(r => {
    const p = pm.get(norm(r[0]));
    return {
      part: String(r[0]), key: norm(r[0]),
      sal: [1, 2, 3].map(i => cell(r[i])), mrp: cell(r[4]),
      old: p ? cell(p[1]) : null,
      pur: p ? [2, 3, 4].map(i => cell(p[i])) : [null, null, null]
    };
  });
}

function render(){
  const q = norm($('q').value), out = $('out');
  if (!q){ out.innerHTML = `<div class="msg">${rows.length} parts loaded. Start typing a Part No.</div>`; return; }
  const m = rows.filter(r => r.key.includes(q))
    .sort((a, b) => (b.key === q) - (a.key === q) || b.key.startsWith(q) - a.key.startsWith(q) || a.part.localeCompare(b.part))
    .slice(0, 30);
  if (!m.length){ out.innerHTML = '<div class="msg">No matching Part No.</div>'; return; }
  out.innerHTML = m.map(r => `<div class="card"><div class="part">${esc(r.part)}</div>
    <div class="purwrap"><div class="sec">Purchase</div><div class="grid pur">${r.pur.map((c, i) => box(c, i + 1)).join('')}</div></div>
    <div class="sec">Sales</div><div class="grid sal">${r.sal.map((c, i) => box(c, i + 1)).join('')}</div>
    <div class="extra">${chip('MRP', r.mrp)}${chip('Current / Old', r.old, 'purwrap')}</div></div>`).join('');
}

function showLogin(msg){
  $('appView').hidden = true; $('loginView').hidden = false;
  $('err').textContent = msg || '';
  $('pw').value = '';
}

async function loadData(){
  $('src').textContent = 'Loading prices...';
  const {data, error} = await sb.from('price_data').select('id,data,updated_at');
  if (error){ $('src').textContent = 'Could not load prices: ' + error.message; return; }
  const s = data.find(d => d.id === 'sales'), p = data.find(d => d.id === 'purchase');
  if (!s){ rows = []; $('src').textContent = 'No price list uploaded yet.'; render(); return; }
  build(s.data, p && p.data);
  $('src').textContent = 'Prices updated ' + new Date(s.updated_at).toLocaleString('en-IN');
  render();
}

async function start(session){
  uid = session.user.id;
  const {data: prof} = await sb.from('profiles').select('role').eq('id', uid).maybeSingle();
  role = prof ? prof.role : null;
  if (!role){ await sb.auth.signOut(); showLogin('This account has no access. Contact the administrator.'); return; }
  $('who').textContent = session.user.email + ' (' + role + ')';
  $('upl').hidden = role !== 'admin';
  $('purOpt').hidden = role === 'viewer';
  document.body.classList.toggle('nopur', role === 'viewer' || !$('showpur').checked);
  $('loginView').hidden = true; $('appView').hidden = false;
  $('q').focus();
  await loadData();
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('err').textContent = '';
  const {data, error} = await sb.auth.signInWithPassword({email: $('email').value.trim(), password: $('pw').value});
  if (error){ $('err').textContent = 'Wrong email or password.'; return; }
  start(data.session);
});
$('logout').addEventListener('click', () => sb.auth.signOut());
$('refresh').addEventListener('click', loadData);
$('q').addEventListener('input', render);
$('showpur').addEventListener('change', e => document.body.classList.toggle('nopur', !e.target.checked));
document.addEventListener('visibilitychange', () => { if (!document.hidden && uid && !$('appView').hidden) loadData(); });

// admin only: the database refuses this for any other role
$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try{
    const wb = XLSX.read(await f.arrayBuffer(), {type: 'array'});
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: true, defval: null});
    const L = layout(raw);
    const d = raw.slice(L.start).filter(r => r && r[L.part] != null && String(r[L.part]).trim() !== '');
    if (!d.length){ alert('No part numbers found in this file.'); return; }
    if (!confirm('Replace the live price list with ' + d.length + ' parts from ' + f.name + '?')) return;
    const nm = r => String(r[L.part]).trim();
    const sales = d.map(r => [nm(r), r[L.sal], r[L.sal + 1], r[L.sal + 2], L.mrp < 0 ? null : r[L.mrp]]);
    const pur = d.map(r => [nm(r), L.old < 0 ? null : r[L.old], r[L.pur], r[L.pur + 1], r[L.pur + 2]]);
    const now = new Date().toISOString();
    const {error} = await sb.from('price_data').upsert([
      {id: 'sales', data: sales, updated_at: now, updated_by: uid},
      {id: 'purchase', data: pur, updated_at: now, updated_by: uid}
    ]);
    if (error){ alert('Upload failed: ' + error.message); return; }
    await loadData();
  }catch(err){ alert('Could not read this file.'); }
});

if (SUPABASE_URL.startsWith('PASTE')){
  showLogin('Setup needed: add your Supabase URL and key at the top of index.html.');
} else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT'){ uid = role = null; rows = []; showLogin(); } });
  sb.auth.getSession().then(({data}) => data.session ? start(data.session) : showLogin());
}
</script>
</body>
</html>
