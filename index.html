<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Lookup</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7280;--line:#e3e6ec;--pur:#475569;--sal:#0b6b3a;--acc:#2457d6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#e8ebf1;--mut:#939bab;--line:#2a303c;--pur:#aab4c5;--sal:#4ade80;--acc:#7aa2ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 12px}
#q{width:100%;font-size:22px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);outline:none}
#q:focus{border-color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:10px 2px 14px;font-size:13px;color:var(--mut)}
.bar button,.bar label.btn{font:inherit;color:var(--acc);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.bar input[type=file]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.part{font-size:20px;font-weight:700;margin-bottom:10px}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:8px 0 6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:62px}
.c .l{font-size:11px;color:var(--mut);display:block}
.c b{font-size:20px;display:block}
.c small{font-size:12px;color:var(--mut)}
.pur b{color:var(--pur)} .sal b{color:var(--sal)}
.na{color:var(--mut)}
.extra{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:14px}
.extra span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.extra em{font-style:normal;color:var(--mut);font-size:12px;margin-right:4px}
.msg{text-align:center;color:var(--mut);padding:36px 0}
body.nopur .purwrap{display:none}
@media (max-width:420px){.c b{font-size:17px}}
</style>
</head>

const EMBED_LABEL = 'Built-in list: Revised Price List - Oct 2026';
const $ = id => document.getElementById(id);
let rows = [];

const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function cell(v){
  if (v == null || String(v).trim() === '') return null;
  if (typeof v === 'number') return {p: v, q: ''};
  const m = String(v).match(/^\s*([\d,]+(?:\.\d+)?)\s*(?:\(\s*([^)]*?)\s*\)?)?\s*$/);
  if (!m) return {p: null, q: String(v)};
  let q = m[2] || '';
  if (/^\d+$/.test(q)) q = String(+q);
  return {p: parseFloat(m[1].replace(/,/g, '')), q};
}
function layout(raw){
  const L = {part: 0, old: 1, pur: 2, sal: 7, mrp: 10, start: 2};   // fallback: original layout
  let hr = -1;
  for (let i = 0; i < Math.min(raw.length, 10); i++)
    if ((raw[i] || []).some(v => /part/i.test(String(v == null ? '' : v)))) { hr = i; break; }
  if (hr < 0) return L;
  const find = re => {
    for (let i = 0; i <= hr; i++){
      const j = (raw[i] || []).findIndex(v => v != null && re.test(String(v)));
      if (j >= 0) return j;
    }
    return -1;
  };
  L.start = hr + 1;
  L.part = Math.max(0, (raw[hr] || []).findIndex(v => /part/i.test(String(v == null ? '' : v))));
  const p = find(/purchase/i), s = find(/^\s*sales?\s*$/i);
  if (p >= 0) L.pur = p;
  if (s >= 0) L.sal = s;
  L.mrp = find(/mrp/i);
  L.old = find(/old|current/i);
  return L;
}
function setRows(raw){
  const L = layout(raw);
  rows = raw.slice(L.start).filter(r => r && r[L.part] != null && String(r[L.part]).trim() !== '').map(r => ({
    part: String(r[L.part]).trim(), key: norm(r[L.part]),
    old: L.old < 0 ? null : cell(r[L.old]),
    pur: [0, 1, 2].map(i => cell(r[L.pur + i])),
    sal: [0, 1, 2].map(i => cell(r[L.sal + i])),
    mrp: L.mrp < 0 ? null : cell(r[L.mrp])
  }));
}
function money(c){
  if (!c) return '<span class="na">&mdash;</span>';
  if (c.p == null) return esc(c.q);
  return '&#8377;' + c.p.toLocaleString('en-IN', {maximumFractionDigits: 2});
}
const box = (c, i) => `<div class="c"><span class="l">${i}</span><b>${money(c)}</b>${c && c.p != null && c.q ? `<small>Qty ${esc(c.q)}</small>` : ''}</div>`;
const chip = (name, c) => c ? `<span><em>${name}</em>${money(c)}${c.p != null && c.q ? ` <small>(${esc(c.q)})</small>` : ''}</span>` : '';

function render(){
  const q = norm($('q').value), out = $('out');
  if (!q){ out.innerHTML = `<div class="msg">${rows.length} parts loaded. Start typing a Part No.</div>`; return; }
  const m = rows.filter(r => r.key.includes(q))
    .sort((a, b) => (b.key === q) - (a.key === q) || b.key.startsWith(q) - a.key.startsWith(q) || a.part.localeCompare(b.part))
    .slice(0, 30);
  if (!m.length){ out.innerHTML = '<div class="msg">No matching Part No.</div>'; return; }
  out.innerHTML = m.map(r => `<div class="card"><div class="part">${esc(r.part)}</div>
    <div class="purwrap"><div class="sec">Purchase</div><div class="grid pur">${r.pur.map((c, i) => box(c, i + 1)).join('')}</div></div>
    <div class="sec">Sales</div><div class="grid sal">${r.sal.map((c, i) => box(c, i + 1)).join('')}</div>
    <div class="extra">${chip('MRP', r.mrp)}<span class="purwrap"${''}>${r.old ? `<em>Current / Old</em>${money(r.old)} <small>${r.old.p != null && r.old.q ? '(' + esc(r.old.q) + ')' : ''}</small>` : ''}</span></div></div>`).join('');
}

function parseBuf(buf){
  const wb = XLSX.read(buf, {type: 'array'});
  const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: true, defval: null});
  setRows(raw);
  return raw;
}
function setSrc(t){ $('src').textContent = t; }

async function load(){
  let ok = false;
  if (typeof XLSX !== 'undefined'){
    try{
      const r = await fetch(FILE + '?t=' + Date.now(), {cache: 'no-store'});
      if (r.ok){
        parseBuf(await r.arrayBuffer());
        const lm = r.headers.get('Last-Modified');
        setSrc('Live from ' + FILE + (lm ? ' \u00b7 updated ' + new Date(lm).toLocaleString('en-IN') : ''));
        ok = true;
      }
    }catch(e){}
  }
  if (!ok){
    try{
      const s = JSON.parse(localStorage.getItem('pricelist2') || 'null');
      if (s){ setRows(s.raw); setSrc('Loaded Excel: ' + s.name + ' \u00b7 ' + s.at); ok = true; }
    }catch(e){}
  }
  if (!ok){ setRows(EMBED); setSrc(EMBED_LABEL); }
  render();
}

$('q').addEventListener('input', render);
$('refresh').addEventListener('click', load);
$('showpur').addEventListener('change', e => document.body.classList.toggle('nopur', !e.target.checked));
$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  if (typeof XLSX === 'undefined'){ alert('Excel reader could not load. Check your internet connection and try again.'); return; }
  try{
    const raw = parseBuf(await f.arrayBuffer());
    const at = new Date().toLocaleString('en-IN');
    try{ localStorage.setItem('pricelist2', JSON.stringify({raw, name: f.name, at})); }catch(err){}
    setSrc('Loaded Excel: ' + f.name + ' \u00b7 ' + at);
    render();
  }catch(err){ alert('Could not read this file.'); }
  e.target.value = '';
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
